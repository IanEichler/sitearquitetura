<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bianca Viana | Editar Links</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A2540" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/admin.css" />
</head>
<body class="admin-page">

  <!-- ── LOGIN ── -->
  <div class="admin-login" id="adminLogin">
    <div class="admin-login-card">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <h1>Editar Links</h1>
      <p>Digite a senha para acessar o painel</p>
      <form id="loginForm">
        <input type="password" id="adminPassword" placeholder="Senha" autocomplete="current-password" />
        <p class="admin-error hidden" id="adminError">Senha incorreta. Tente novamente.</p>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ── EDITOR ── -->
  <div class="admin-editor hidden" id="adminEditor">
    <div class="admin-header">
      <h1>Editar página de links</h1>
      <div class="admin-header-actions">
        <a href="/links.html" target="_blank" class="btn btn-outline">Ver página</a>
        <button id="logoutBtn" class="btn btn-ghost">Sair</button>
      </div>
    </div>

    <section class="admin-section">
      <h2>Perfil</h2>
      <div class="admin-field">
        <label for="profileName">Nome</label>
        <input type="text" id="profileName" />
      </div>
      <div class="admin-field">
        <label for="profileSubtitle">Subtítulo (use quebras de linha para separar linhas)</label>
        <textarea id="profileSubtitle" rows="2"></textarea>
      </div>
      <div class="admin-field">
        <label for="profileAvatar">Foto de perfil (caminho ou URL da imagem)</label>
        <input type="text" id="profileAvatar" />
      </div>
    </section>

    <section class="admin-section">
      <h2>Links</h2>
      <div id="linksEditorList"></div>
      <button type="button" class="admin-add-link" id="addLinkBtn">+ Adicionar link</button>
      <p class="admin-hint">
        "Ícone" usa o nome de um ícone do <a href="https://lucide.dev/icons" target="_blank" rel="noopener">lucide.dev/icons</a>
        (ex.: <code>calendar-check</code>, <code>globe</code>, <code>instagram</code>).
        Marque "Destaque" para deixar o botão em azul.
      </p>
    </section>

    <div class="admin-save-bar">
      <button type="button" class="btn btn-primary" id="saveBtn">Salvar alterações</button>
      <button type="button" class="btn btn-ghost" id="resetBtn">Restaurar padrão</button>
      <span class="admin-save-status" id="saveStatus">Alterações salvas!</span>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
